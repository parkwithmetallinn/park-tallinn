<!doctype html>
<html lang="et" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2F4F7" />
    <meta
      name="description"
      content="Tallinna tasuta ja kellaajaga parkimine — avalikud parklad, tänavaäärsed kohad, Pargi ja Reisi."
    />
    <script>
      /* Must match THEME_STORAGE_KEY / LEGACY in src/lib/theme.ts */
      try {
        localStorage.removeItem('parkvibe_theme')
        var t = localStorage.getItem('parktallinn:theme:v2')
        if (t !== 'light' && t !== 'dark') t = 'light'
        document.documentElement.classList.toggle('map-dark', t === 'dark')
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'dark' ? '#12161c' : '#F2F4F7')
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <title>Park Tallinn — Tasuta parkimine</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
